[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mem-layer"
version = "0.1.0"
description = "Graph-based memory management system for AI models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "0xSero", email = "contact@example.com"}
]
keywords = ["ai", "memory", "graph", "knowledge-graph", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "networkx>=3.2",
    "click>=8.1.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "python-dateutil>=2.8.0",
    "pyyaml>=6.0",
    "sqlite-utils>=3.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "mypy>=1.7.0",
    "ruff>=0.1.8",
    "ipython>=8.18.0",
]
web = [
    "fastapi>=0.108.0",
    "uvicorn>=0.25.0",
    "websockets>=12.0",
]
tui = [
    "textual>=0.47.0",
]
viz = [
    "matplotlib>=3.8.0",
    "pygraphviz>=1.11",
]
all = [
    "mem-layer[dev,web,tui,viz]",
]

[project.scripts]
mem-layer = "mem_layer.cli.main:cli"

[project.urls]
Homepage = "https://github.com/0xSero/mem-layer"
Documentation = "https://github.com/0xSero/mem-layer/docs"
Repository = "https://github.com/0xSero/mem-layer"
Issues = "https://github.com/0xSero/mem-layer/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mem_layer*"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=mem_layer --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
